name: release

# Three channels: dev, beta and stable. A push drives the first two, and the
# third is a promotion of the second.
#
#   dev     every push to `dev` rebuilds a phone package (dev-preview.yaml:
#           Android arm64 only, no tests) and announces it privately. The fast
#           loop while a change is settling.
#   beta    every push to `beta` runs this workflow: it tests every platform
#           and builds the phone package, then publishes a prerelease to the
#           channel. A commit that reached beta is one the app's own checks let
#           through. Desktop and Linux rides come with the stable channel, which
#           builds all of them.
#   stable  a beta that held: `promote` moves beta's tree into `main`, and the
#           stable channel tests and builds that.
#
# Skyward is maintained independently: this workflow no longer pulls from or
# rebases onto the upstream project (FlClash). It builds and releases only what
# lives on our own branches. `main` only moves on promotion -- the stable channel
# ships code that already ran as beta.
#
# The `ci` branch holds the automation, and a promotion refreshes the copies on
# `main` from it -- a manual run is dispatched from `ci`, so these files take
# effect without waiting for a promotion. build-channel.yaml and
# publish-release.yaml are among them but also have to sit in the branch trees:
# a push-triggered workflow only runs from the branch that received the push.
#
# Flow: [push dev -> dev package] -> [push beta -> beta release] ->
# (promote) main = beta's tree -> stable release.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to plan and build
        type: choice
        options:
          - beta
          - stable
          - all
        default: beta
      promote:
        description: Promote beta into main (the stable channel) and build it -- needs channel=stable or all
        type: boolean
        default: false
      force_build:
        description: Build even when nothing moved
        type: boolean
        default: false
      publish:
        description: Create the release and announce it on Telegram (a push always publishes)
        type: boolean
        default: true
  # A push to beta is a beta release: it ran the app's checks to get there, so
  # the channel tests every platform and publishes the result. A manual
  # dispatch is what re-runs one, or promotes it.
  push:
    branches:
      - beta
    # A push that changes no app code has nothing to install: documentation and
    # the automation itself are not a beta.
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      - 'snapshots/**'
      - '.desktop-preview'

concurrency:
  # A push cancels the push it supersedes -- three quick commits should not
  # queue three half-hour releases. A dispatch is never cancelled: it may be
  # halfway through publishing, and its tag is already written.
  group: sync-and-release-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# This workflow force-pushes our branches and tags, and the build / publish
# workflows this one calls create releases and read back earlier runs. A called
# workflow cannot ask for more than its caller holds, so both scopes have to be
# granted here as well -- `contents: read` alone makes every dispatch fail at
# startup.
permissions:
  contents: write
  actions: read

jobs:
  sync:
    name: Plan release
    runs-on: ubuntu-latest
    # Force-pushes branches and tags to our repository.
    permissions:
      contents: write
    outputs:
      build_stable: ${{ steps.plan.outputs.build_stable }}
      build_beta: ${{ steps.plan.outputs.build_beta }}
      version_stable: ${{ steps.rebase.outputs.version_stable }}
      version_beta: ${{ steps.rebase.outputs.version_beta }}
      build_number_stable: ${{ steps.rebase.outputs.build_number_stable }}
      build_number_beta: ${{ steps.rebase.outputs.build_number_beta }}
    steps:
      - name: Plan and promote
        id: rebase
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN || github.token }}
          # A push is the beta channel; a dispatch names the one it wants.
          CHANNEL: ${{ inputs.channel || 'beta' }}
          PROMOTE: ${{ inputs.promote || 'false' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          auth="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --quiet --filter=blob:none "$auth" work
          cd work
          # Skyward is maintained independently: this workflow no longer pulls
          # from or rebases onto the upstream project. It builds and releases
          # only what lives on our own branches.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          case "$CHANNEL" in
            all) channels="stable beta" ;;
            stable) channels="stable" ;;
            beta) channels="beta" ;;
            *) echo "::error::unknown channel '$CHANNEL' (expected all, beta or stable; the stable channel builds branch main)"; exit 1 ;;
          esac

          # A channel is not a branch: the stable channel (what the repository
          # shows by default) is our `main`, and the beta channel is `beta`.
          # The step outputs and the jobs that read them stay keyed by channel,
          # so only the git work below uses $br.
          branch_of() { [ "$1" = stable ] && echo main || echo beta; }

          # main is never synced from upstream -- only promoted into -- so unlike
          # beta it has no "nothing to sync yet" case.
          if git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "exists_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main does not exist yet, nothing to promote into"
            echo "exists_stable=false" >> "$GITHUB_OUTPUT"
          fi

          # beta is checked out so the promotion and the version numbering below
          # can read it; there is no upstream to rebase onto, so it is always
          # ready to release.
          if ! git rev-parse --verify --quiet refs/remotes/origin/beta >/dev/null; then
            echo "::notice::beta does not exist yet, nothing to build"
            echo "exists_beta=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists_beta=true" >> "$GITHUB_OUTPUT"
            git checkout --quiet -B beta refs/remotes/origin/beta

            # beta builds from whatever it holds now -- there is no upstream to
            # rebase onto, so it is always ready to release.
            echo "synced_beta=true" >> "$GITHUB_OUTPUT"
          fi

          # Promotion: the stable channel ships what beta has already run, so it
          # takes beta's tree wholesale.
          #
          # A content merge -- even with `-X theirs` -- is not an option:
          # our `main` and `beta` are independent branches that have never been
          # merged, so their common ancestor is far behind and merging would
          # union both lines. The stable channel would then ship code beta never
          # ran. Instead the index is reset onto beta's tree, the working tree
          # follows it, and anything beta does not have is dropped. The workflow
          # copies are then taken from ci, their source of truth.
          #
          # The commit still names beta as a second parent. Because the two
          # branches share no merge ancestry, GitHub reads every push to beta as
          # an unmerged branch and offers a pull request carrying the whole tree
          # against main. `-s ours` records the parents and leaves the tree
          # alone -- the read-tree below is what ships.
          if [ "$PROMOTE" = true ]; then
            case " $channels " in
              *" stable "*) ;;
              *) echo "::notice::promote needs the stable channel; use channel=all or channel=stable"; PROMOTE=false ;;
            esac
          fi
          if [ "$PROMOTE" = true ]; then
            main_before=$(git rev-parse refs/remotes/origin/main)
            beta_tip=$(git rev-parse refs/heads/beta)
            git checkout --quiet -B main "$main_before"
            if git merge-base --is-ancestor "$beta_tip" HEAD; then
              echo "main already carries beta; nothing to promote"
            else
              # Files beta leaves behind would block the merge, and beta's tree
              # is what the promotion puts in place anyway.
              git clean --quiet -fd
              git merge --quiet --no-ff --allow-unrelated-histories -s ours \
                -m "promote: beta $(git rev-parse --short "$beta_tip") into main" \
                "$beta_tip"
              git read-tree -u --reset "$beta_tip"
              git checkout --quiet refs/remotes/origin/ci -- \
                .github/workflows/ci.yaml \
                .github/workflows/build-channel.yaml \
                .github/workflows/publish-release.yaml \
                .github/workflows/core-watch.yaml
              git add -A
              git commit --quiet --amend --no-edit
              # The stable channel has to build exactly what beta ran, so the
              # workflow copies are the only thing allowed to differ -- checked
              # rather than trusted.
              unexpected=$(git diff --name-only beta \
                | grep -vE '^\.github/workflows/[A-Za-z0-9_.-]+$' || true)
              if [ -n "$unexpected" ]; then
                echo "::error::main does not match beta after promotion:"
                printf '%s\n' "$unexpected"
                exit 1
              fi
              git push --quiet origin main
              echo "synced_stable=true" >> "$GITHUB_OUTPUT"
              echo "stable: promoted beta $(git rev-parse --short "$beta_tip") into main"
            fi
          fi

          # Two numbers per release, and they never look like each other.
          #
          # The one users see is our own three-component base -- taken from this
          # repository's pubspec.yaml, not from any upstream -- plus a fourth of
          # our own, counting the releases of the line it belongs to: a new version
          # line starts at .0, and a promoted beta takes a fresh number so that
          # beta users are offered the stable build as well. The channel rides
          # along as a suffix, never as digits: `1.0.1.6-beta` for a beta, plain
          # `1.0.1.6` for a release. The app carries it as APP_VERSION (see the
          # build workflow), and the release tag is exactly it.
          #
          # The versionCode -- what Android uses to decide whether one build may
          # install over another -- is a day number written as <20900294><01>:
          # 2,090,000,000 plus a hundred per calendar day since 2026-01-01, plus
          # the sequence that day. The floor sits above the 2,090,00x,xxx
          # numbers the early test packages were published with, which is what
          # made a release arriving on a phone that still ran one a downgrade;
          # the ceiling is 2,100,000,000, past which Flutter refuses to build,
          # and a hundred codes a day keeps the series inside it for another 270
          # years. Every channel draws from the one counter, stable first: the
          # same day gives stable ...01, then beta ...02, then a dev build ...03.
          #
          # The sequence is one past the highest spent *that day*: not the
          # number of tags, because counting assumes the stamps are contiguous
          # and any tag that ever went missing would hand the same number out
          # twice; and not per version, because that restarts at 01 the moment
          # a new version line is cut, and on a day that already had a
          # release it would produce a lower versionCode than the one already on
          # the phone, which Android refuses to install over.
          #
          # The tags carry only the version, so the build number is read back
          # from the release titles and notes, which is where it is written;
          # releases come back newest first, so the ones spent today are on the
          # first page. A snapshot writes down the code it built against rather
          # than the ABI-shifted one its arm64 APK carries, so one reading
          # serves every channel. The revision is counted from the tags in the
          # clone instead of the tags API, which pages at 100 names and a busy
          # tag history can outgrow quickly.
          now=$(date -u +%s)
          origin=$(date -u -d 2026-01-01 +%s)
          day_prefix=$(( 20900000 + (now - origin) / 86400 ))
          titles=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | .name, .body] | .[]' 2>/dev/null || true)
          # Today's claimed numbers live in the tags a snapshot writes before it
          # builds. A dev build writes one; a preview build used to, and a tag
          # it left behind the same day is still a number already spent. Read
          # them from the API rather than from the clone: the checkout is
          # shallow, a clone with no tags reads as "nothing was claimed today",
          # and that is exactly how a beta once came out with a lower
          # versionCode than the package already on the phone -- which Android
          # refuses to install over.
          preview_tags=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/preview-${day_prefix}" \
            --jq '.[].ref' 2>/dev/null || true)
          dev_tags=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/dev-${day_prefix}" \
            --jq '.[].ref' 2>/dev/null || true)
          highest_stamp=$(printf '%s\n' "$titles" "$preview_tags" "$dev_tags" \
            | sed -n "s/.*${day_prefix}\([0-9][0-9]*\).*/\1/p" | sort -n | tail -1)
          # 10#: past the eighth build of a day the stamp carries a leading zero,
          # and bash would read a bare 09 as an invalid octal number.
          stamp=$(( 10#${highest_stamp:-0} + 1 ))
          # The last number any published release carried, whatever day it was
          # cut on. A pruned preview tag must not let the next release fall
          # behind the code it already handed out.
          last_code=$(printf '%s\n' "$titles" \
            | sed -n 's/.*skyward:build-number:\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
          taken=""
          for ch in $channels; do
            br=$(branch_of "$ch")
            git rev-parse --verify --quiet "refs/heads/$br" >/dev/null || continue
            base_version=$(git show "$br:pubspec.yaml" | sed -n 's/^version: *\([^+]*\).*/\1/p' | tr -d '\r')
            # The fourth component counts the releases of this line, so a new
            # line starts at .0 instead of inheriting the last line's count.
            # Past the highest tag of the line, so a tag that went missing never
            # hands the same number out twice. A beta tag carries its channel as
            # a suffix (`v1.0.1.6-beta`) and spends a number just the same.
            highest_revision=$(git tag --list "v${base_version}.*" \
              | sed -n "s/^v${base_version//./\\.}\.\([0-9][0-9]*\)\(-[a-z]*\)\?$/\1/p" \
              | sort -n | tail -1)
            if [[ -n "$highest_revision" ]]; then
              revision=$(( 10#${highest_revision} + 1 ))
            else
              revision=0
            fi
            while [[ " $taken " == *" ${base_version}.${revision} "* ]]; do
              revision=$(( revision + 1 ))
            done
            taken="$taken ${base_version}.${revision}"
            code=$(( day_prefix * 100 + stamp ))
            # A pruned preview or dev tag must not let this release fall behind
            # a number already handed out: the notes of the newest release carry
            # the other half of the ledger.
            if [ -n "${last_code:-}" ] && [ "$code" -le "$last_code" ]; then
              code=$(( last_code + 1 ))
            fi
            # The channel rides in the version as a suffix, never as digits: the
            # four components name the line and its revision, and `-beta` says
            # who built it. The versionCode stays in the build number, where it
            # orders installs without being read out as a version.
            suffix=""
            [ "$ch" = beta ] && suffix="-beta"
            echo "version_$ch=${base_version}.${revision}${suffix}" >> "$GITHUB_OUTPUT"
            echo "build_number_$ch=${code}" >> "$GITHUB_OUTPUT"
            echo "$ch ($br): next version ${base_version}.${revision}${suffix}, build number ${code}"
            stamp=$(( code - day_prefix * 100 + 1 ))
          done

      - name: Plan
        id: plan
        env:
          CHANNEL: ${{ inputs.channel || 'beta' }}
          FORCE: ${{ inputs.force_build || 'false' }}
          SYNCED_STABLE: ${{ steps.rebase.outputs.synced_stable }}
          SYNCED_BETA: ${{ steps.rebase.outputs.synced_beta }}
          EXISTS_STABLE: ${{ steps.rebase.outputs.exists_stable }}
          EXISTS_BETA: ${{ steps.rebase.outputs.exists_beta }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            all) want_stable=true; want_beta=true ;;
            stable) want_stable=true; want_beta=false ;;
            beta) want_stable=false; want_beta=true ;;
            *) echo "::error::unknown channel '$CHANNEL' (expected all, beta or stable; the stable channel builds branch main)"; exit 1 ;;
          esac

          # A channel only gets built if it exists: `force_build` means "build
          # even when nothing moved", not "build the ones we have not created
          # yet". What "nothing moved" means depends on the channel -- a
          # promotion for stable, a prior beta release for beta.
          decided() { # $1 = wanted, $2 = synced, $3 = exists
            [ "$1" = true ] && [ "$3" = true ] &&
              { [ "$2" = true ] || [ "$FORCE" = true ]; } && echo true || echo false
          }

          echo "build_stable=$(decided "$want_stable" "$SYNCED_STABLE" "$EXISTS_STABLE")" >> "$GITHUB_OUTPUT"
          echo "build_beta=$(decided "$want_beta" "$SYNCED_BETA" "$EXISTS_BETA")" >> "$GITHUB_OUTPUT"
          echo "plan: stable=$want_stable exists=$EXISTS_STABLE synced=$SYNCED_STABLE"
          echo "plan: beta=$want_beta exists=$EXISTS_BETA synced=$SYNCED_BETA force=$FORCE"

  test-stable:
    name: Test stable
    needs: sync
    if: needs.sync.outputs.build_stable == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: stable
      branch: main
      env: stable
      version: ${{ needs.sync.outputs.version_stable }}
      build_number: ${{ needs.sync.outputs.build_number_stable }}
      stage: test
    secrets: inherit

  build-stable:
    name: Build stable
    needs: [sync, test-stable]
    if: needs.sync.outputs.build_stable == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: stable
      branch: main
      env: stable
      version: ${{ needs.sync.outputs.version_stable }}
      build_number: ${{ needs.sync.outputs.build_number_stable }}
      stage: build
    secrets: inherit

  test-beta:
    name: Test beta
    needs: sync
    if: needs.sync.outputs.build_beta == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: beta
      branch: beta
      env: pre
      version: ${{ needs.sync.outputs.version_beta }}
      build_number: ${{ needs.sync.outputs.build_number_beta }}
      stage: test
    secrets: inherit

  build-beta:
    name: Build beta
    needs: [sync, test-beta]
    if: needs.sync.outputs.build_beta == 'true'
    uses: ./.github/workflows/build-channel.yaml
    with:
      channel: beta
      branch: beta
      env: pre
      version: ${{ needs.sync.outputs.version_beta }}
      build_number: ${{ needs.sync.outputs.build_number_beta }}
      stage: build
      # The phone only. Every push publishes a beta, and the full matrix is six
      # runners -- two of them macOS, billed at ten times the rate -- for a
      # package that is mostly installed on a phone to see whether it works.
      # Desktop and Linux reach their users through a stable release, which
      # still builds every platform.
      platforms: android
      # And one APK, not three: arm64 is what every phone that would install a
      # beta runs. A split build's extra ABIs only mean two more files to
      # download, upload and tell apart on a release page nobody reads for a
      # build that is replaced in hours.
      android_abi: arm64
    secrets: inherit

  # A release needs its own channel's tests to have passed. A single failed
  # platform only costs that platform: fail-fast is off in the build matrix and
  # publishing whatever arrived is the point, so only `cancelled` blocks it.
  release-stable:
    name: Release stable
    needs: [sync, test-stable, build-stable]
    if: >-
      inputs.publish &&
      needs.sync.outputs.build_stable == 'true' &&
      needs.test-stable.result == 'success' &&
      needs.build-stable.result != 'cancelled'
    uses: ./.github/workflows/publish-release.yaml
    with:
      channel: stable
      branch: main
      version: ${{ needs.sync.outputs.version_stable }}
      build_number: ${{ needs.sync.outputs.build_number_stable }}
      prerelease: false
    secrets: inherit

  release-beta:
    name: Release beta
    needs: [sync, test-beta, build-beta]
    # A push is a beta release -- that is what pushing to beta means. A
    # dispatch may opt out with publish=false.
    if: >-
      (github.event_name == 'push' || inputs.publish) &&
      needs.sync.outputs.build_beta == 'true' &&
      needs.test-beta.result == 'success' &&
      needs.build-beta.result != 'cancelled'
    uses: ./.github/workflows/publish-release.yaml
    with:
      channel: beta
      branch: beta
      version: ${{ needs.sync.outputs.version_beta }}
      build_number: ${{ needs.sync.outputs.build_number_beta }}
      prerelease: true
    secrets: inherit
