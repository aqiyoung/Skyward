name: benchmark

# What the tunnel costs, measured on one machine: the client, the core and
# the target all live here, so the number is the core's own capacity.
#
# The tunnel is brought up the way the application brings it up, through the
# wrapper, because the bare kernel binary starts neither the listeners nor
# the tunnel. Two stacks are measured the same way in the same run: the one
# the releases carry and the go stack. The ratio is the question.

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.27.1'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      # The submodule URL is SSH; public repos clone fine over HTTPS, so redirect.
      - name: Clone submodules over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Build the benchmark
        working-directory: core
        run: go build -o "$RUNNER_TEMP/bench" ./cmd/bench
      - name: Measure
        run: |
          set -euo pipefail
          for stack in legacy go; do
            echo "=== the $stack stack ==="
            sudo "$RUNNER_TEMP/bench" -stack "$stack" -runs 3 -size 64 | tee "$RUNNER_TEMP/$stack.log"
          done
      - name: Attach the numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tunnel-benchmark
          path: |
            ${{ runner.temp }}/legacy.log
            ${{ runner.temp }}/go.log
