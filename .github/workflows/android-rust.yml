name: android-rust

# Builds a test APK of the Skyward App whose core is the Rust cdylib from
# aqiyoung/skyward-core (rust-core branch), not the default gomobile Go core.
#
# The App's Kotlin bridge (Core.kt -> com.follow.clash.core.mobile.Mobile) is
# unchanged; Gradle is switched to the hand-written JNI classes + prebuilt
# libskyward_core.so via -PrustCore. A fixed test keystore (GitHub secrets) is
# used so every build has the SAME signature and installs over the previous
# one; its signature differs from the Go release and applicationId is
# `com.threely.skyward.rust`, so both can be installed side by side.
#
# Three distribution channels, chosen at dispatch time: `release` publishes a
# GitHub Release and pushes the APK to the Telegram subscription channel;
# `test` sends the APK to the Bot private chat; `artifact` uploads only the
# Actions artifact. Test and artifact builds use a -test.<run> version.

on:
  workflow_dispatch:
    inputs:
      so_url:
        description: 'Optional prebuilt skyward-core package URL; empty builds the pinned source'
        required: false
        default: ''
      core_ref:
        description: 'Full skyward-core commit SHA to build when so_url is empty'
        required: false
        default: '3ec7a09e1721a4965265ef1a06f0db34293f56a7'
      version:
        description: 'Version shown in the app (test/artifact channels append -test.<run>)'
        required: false
        default: '1.0.0.99-rust'
      channel:
        description: 'release = release + subscription channel; test = Bot private chat; artifact = Actions artifact only'
        required: false
        type: choice
        options:
          - release
          - test
          - artifact
        default: release
      changelog:
        description: 'Update log sent with the Telegram message'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-rust-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  NDK_VERSION: r28c

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The Rust-core Gradle switches + JNI classes live on this branch.
          ref: rust-core
          # pubspec.yaml bundles the Go submodule's CA cert as a Flutter asset;
          # that file must exist even though the core itself is now Rust.
          submodules: recursive

      - name: Checkout pinned Rust core source
        if: ${{ inputs.so_url == '' }}
        uses: actions/checkout@v4
        with:
          repository: aqiyoung/skyward-core
          ref: ${{ inputs.core_ref || '3ec7a09e1721a4965265ef1a06f0db34293f56a7' }}
          path: skyward-core

      - name: Install Rust Android target
        if: ${{ inputs.so_url == '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust core build
        if: ${{ inputs.so_url == '' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: skyward-core -> skyward-core/target

      - name: Resolve version for this channel
        env:
          CHANNEL: ${{ inputs.channel }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "test" ] || [ "$CHANNEL" = "artifact" ]; then
            base="${RAW_VERSION:-1.0.0.99-rust}"
            base="${base%-rust}"
            resolved="${base}-test.${{ github.run_number }}"
          else
            resolved="${RAW_VERSION:-1.0.0.99-rust}"
          fi
          echo "VERSION=$resolved" >> "$GITHUB_ENV"
          echo "channel=$CHANNEL version=$resolved"

      - name: Download Rust core .so package
        if: ${{ inputs.so_url != '' }}
        env:
          SO_URL: ${{ inputs.so_url }}
        run: |
          set -euo pipefail
          curl -fsSL "$SO_URL" -o /tmp/core.zip
          mkdir -p /tmp/core-pkg
          (cd /tmp/core-pkg && unzip -o /tmp/core.zip)
          ls -la /tmp/core-pkg
          test -f /tmp/core-pkg/libskyward_core.so
          mkdir -p android/core/src/main/jniLibs/arm64-v8a
          mkdir -p android/core/src/main/java/com/follow/clash/core/mobile
          cp /tmp/core-pkg/libskyward_core.so android/core/src/main/jniLibs/arm64-v8a/
          # JNI Java classes: only add if not already committed in this branch.
          mkdir -p android/core/src/main/java/com/follow/clash/core/mobile
          cp -f /tmp/core-pkg/jni/com/follow/clash/core/mobile/*.java \
                android/core/src/main/java/com/follow/clash/core/mobile/ 2>/dev/null || true
          echo "so installed: $(stat -c%s android/core/src/main/jniLibs/arm64-v8a/libskyward_core.so) bytes"

      - name: Enable Rust core in Gradle
        run: |
          set -euo pipefail
          echo "rustCore=true" >> android/gradle.properties
          cat android/gradle.properties | tail -5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Build Rust core from pinned source
        if: ${{ inputs.so_url == '' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CORE_REF: ${{ inputs.core_ref || '3ec7a09e1721a4965265ef1a06f0db34293f56a7' }}
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME"
          LLVM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LLVM/aarch64-linux-android26-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$LLVM/llvm-ar"
          export CC_aarch64_linux_android="$LLVM/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$LLVM/llvm-ar"
          actual_ref=$(git -C skyward-core rev-parse HEAD)
          test "$actual_ref" = "$CORE_REF"
          cargo build --locked --release --manifest-path skyward-core/Cargo.toml \
            --target aarch64-linux-android
          SO=skyward-core/target/aarch64-linux-android/release/libskyward_core.so
          test -f "$SO"
          "$LLVM/llvm-nm" -D --defined-only "$SO" \
            | grep -q Java_com_follow_clash_core_mobile_Mobile_invokeMethod
          mkdir -p android/core/src/main/jniLibs/arm64-v8a
          cp "$SO" android/core/src/main/jniLibs/arm64-v8a/
          echo "Built skyward-core $actual_ref ($(stat -c%s "$SO") bytes)"
          echo "Rust core: $actual_ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Install fixed test keystore (stable signature)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_RUST_TEST }}
          STORE_PASS: ${{ secrets.KEYSTORE_RUST_PASS }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_RUST_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASS:-}" ]; then
            echo "::error::fixed test keystore secrets missing"; exit 1
          fi
          # Stable, committed-once test key: every build uses the same signature,
          # so updates install over each other. Signature differs from the Go
          # release, and applicationId (.rust) keeps both installed side by side.
          echo "$KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          {
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=${KEY_ALIAS:-rustcore}"
            echo "keyPassword=$STORE_PASS"
          } >> android/local.properties
          echo "installed fixed test keystore (stable signature)"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build arm64 APK (Rust core)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          APP_VERSION_NAME: ${{ env.VERSION }}
          APP_CHANNEL_NAME: rust
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # Keep the signing props written by the keystore step; append SDK paths.
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cd android
          cp -R "$wrapper/." .
          chmod +x gradlew
          cd ..
          dart setup.dart android --env stable --arch arm64 -v

      - name: Verify APK
        env:
          EXPECTED_CERT: 618247c29a1519d757287f7f3c10fb288afa2d369bfe36bc3b4d4d6b2ec6820a
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs dist -name '*.apk' 2>/dev/null | head -1)
          echo "APK=$APK"
          test -n "$APK"
          mkdir -p dist && cp "$APK" dist/skyward-rust-core-arm64.apk
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --verbose dist/skyward-rust-core-arm64.apk | head -8
          echo "size: $(stat -c%s dist/skyward-rust-core-arm64.apk) bytes"
          # Confirm the signature is the fixed test key (stable across builds).
          CERT=$("$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs dist/skyward-rust-core-arm64.apk \
            | grep -i 'SHA-256' | head -1 | sed 's/.*: //' | tr -d ' ' | tr 'A-Z' 'a-z')
          echo "signer cert sha256: $CERT"
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::unexpected signer cert (expected $EXPECTED_CERT)"; exit 1
          fi

      - name: Publish GitHub Release
        if: inputs.channel == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="Skyward ${VERSION} - Rust core edition (arm64)."
          if [ -n "${CHANGELOG:-}" ]; then
            notes=$(printf '%s\n\n%s' "$notes" "$CHANGELOG")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/skyward-rust-core-arm64.apk --clobber
            gh release edit "$tag" --title "Skyward ${VERSION} (Rust core)" --notes "$notes" --prerelease
          else
            gh release create "$tag" dist/skyward-rust-core-arm64.apk --title "Skyward ${VERSION} (Rust core)" --notes "$notes" --prerelease
          fi
          echo "release published: $tag"
      - name: Push APK to Telegram (subscription channel)
        if: inputs.channel == 'release'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ env.VERSION }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TG secrets missing"; exit 1
          fi
          # The update log rides along with the APK; Telegram captions are capped
          # at 1024 bytes, so keep it to the first lines that matter.
          caption="Skyward $VERSION (Rust core, arm64)"
          if [ -n "${CHANGELOG:-}" ]; then
            caption=$(printf '%s\n%s' "$caption" "$CHANGELOG")
          fi
          caption=$(printf '%s' "$caption" | head -c 1000)
          echo "--- caption ---"
          printf '%s\n' "$caption"
          echo "---------------"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@dist/skyward-rust-core-arm64.apk" \
            -F "caption=${caption}" | grep -q '"ok":true' \
            || { echo "::error::TG upload failed"; exit 1; }
          echo "APK pushed to Telegram"

      - name: Push APK to Telegram (Bot private chat, test builds)
        if: inputs.channel == 'test'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
          VERSION: ${{ env.VERSION }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TG secrets missing"; exit 1
          fi
          caption="Skyward $VERSION (Rust core TEST build, arm64) - not a release"
          if [ -n "${CHANGELOG:-}" ]; then
            caption=$(printf '%s\n%s' "$caption" "$CHANGELOG")
          fi
          caption=$(printf '%s' "$caption" | head -c 1000)
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@dist/skyward-rust-core-arm64.apk" \
            -F "caption=${caption}" | grep -q '"ok":true' \
            || { echo "::error::TG upload failed"; exit 1; }
          echo "test APK pushed to Bot private chat"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyward-rust-core-arm64
          path: dist/skyward-rust-core-arm64.apk
          if-no-files-found: error
