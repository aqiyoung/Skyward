name: dev-desktop

# The desktop dev channel: one Windows build, no tests, sent to Telegram as a
# document so it can be tried without waiting for a full build of every
# platform. No GitHub Release is created here: a Release is only ever beta or
# stable, both published manually through ci.yaml.
#
# A push to `dev` that touches `.desktop-preview` rebuilds it; it can also be
# started by hand via workflow_dispatch. The packages go to the private
# Telegram chat -- no GitHub Release, which stays manual (beta/stable only).
#
# Its number is its own: it has to fit in a Windows file version (four 16-bit
# fields), so the larger phone counter cannot be reused. A git tag records the
# number so the next run can advance it; a tag is not a Release. The tag is not
# `v*` either, so ci.yaml's version counter never counts it.
on:
  push:
    branches:
      - dev
    paths:
      - '.desktop-preview'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        type: string
        default: dev
      env:
        description: Value passed to `dart setup.dart --env`
        type: choice
        options:
          - pre
          - dev
          - stable
        default: pre
      arch:
        description: Windows architecture to package
        type: choice
        options:
          - amd64
          - arm64
        default: amd64

concurrency:
  group: preview-desktop-${{ inputs.ref || 'beta' }}-${{ inputs.arch || 'amd64' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'
  GO_VERSION: '1.27.4'

jobs:
  preview:
    name: Windows ${{ inputs.arch || 'amd64' }}
    # The arm runner is the only one that builds an arm64 Windows binary, and
    # it needs Rust set up by hand; the x64 one has it in the image.
    runs-on: ${{ (inputs.arch || 'amd64') == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      previous: ${{ steps.changelog.outputs.previous }}
      entries: ${{ steps.changelog.outputs.entries }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'beta' }}
          submodules: recursive

      - name: Enable git long paths
        run: git config --global core.longpaths true

      # A Windows file version is four 16-bit fields, and the installer carries
      # this number as one of them, so the fourth component has to stay under
      # 65535. The preview channel's 2,09x,xxx,xxx numbering would overflow it,
      # which is why a desktop preview counts its own: 100 per day since
      # 2026-01-01 plus the sequence that day.
      #
      # The pubspec takes three components plus the build number, so the
      # packaging tools name their files after upstream's version; the name
      # users see is put on afterwards, as in the release build.
      - name: Choose a preview version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -1 | tr -d '\r')"
          if ! printf '%s' "$base" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::expected a three-component version in pubspec.yaml, got '$base'"
            exit 1
          fi
          now=$(date -u +%s)
          origin=$(date -u -d 2026-01-01 +%s)
          prefix=$(( (now - origin) / 86400 * 100 ))
          tags=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/dev-win-" \
            --jq '.[].ref' 2>/dev/null || true)
          # Only this day's numbers count: yesterday's are below the prefix and
          # the next run must not walk backwards past it.
          highest=$(printf '%s\n' "$tags" \
            | sed -n 's,^refs/tags/dev-win-\([0-9][0-9]*\)$,\1,p' \
            | awk -v p="$prefix" '$1 >= p' | sort -n | tail -1)
          build_number=$(( ${highest:-$(( prefix - 1 ))} + 1 ))
          if [ "$build_number" -ge 65535 ]; then
            echo "::error::build number ${build_number} no longer fits a Windows file version"
            exit 1
          fi
          # What users read is four components: major and patch from upstream,
          # second component the channel code (0 here for DEV), fourth today's
          # count. The build number stays behind it for the Windows file version,
          # which takes digits only.
          major="${base%%.*}"
          patch="${base##*.}"
          version="${major}.0.${patch}.$(printf '%02d' "$(( build_number - prefix ))")"
          awk -v v="${base}+${build_number}" '/^version:/{ print "version: " v; next } { print }' \
            pubspec.yaml > pubspec.yaml.new
          mv pubspec.yaml.new pubspec.yaml
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "building ${version} from ${base}, file version ${build_number}"

      # What changed since the previous desktop preview, so the release page
      # says what to look at rather than only which number it is.
      - name: Collect the changelog
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-win-${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          previous=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/dev-win-" \
            --jq '.[].ref' 2>/dev/null \
            | sed -n 's,^refs/tags/\(dev-win-[0-9][0-9]*\)$,\1,p' \
            | grep -vx "$TAG" | sort -t- -k3 -n | tail -1 || true)
          commit="$(git rev-parse HEAD)"

          entries=""
          if [ -n "$previous" ]; then
            prev_sha=$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${previous}" \
              --jq '.object.sha' 2>/dev/null || true)
            echo "changelog: $previous ($prev_sha)...$commit"
            entries=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev_sha}...${commit}" \
              --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null \
              | sed '/^$/d; s/^/- /' | grep -v '^- ci' | tac | awk 'NR<=40' || true)
          else
            echo "::notice::this is the first desktop preview; no changelog range"
          fi

          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          {
            echo "entries<<CHANGELOG_END"
            printf '%s\n' "$entries"
            echo "CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Rust (Windows arm64)
        if: (inputs.arch || 'amd64') == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: preview-desktop-${{ inputs.arch || 'amd64' }}
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      # The Core embeds this bundle and FlClashHttpOverrides.trustCoreRoots
      # hands it to Dart; the submodule only carries a 0-byte placeholder, so a
      # build without this step ships a Core with no roots. Pinned by hash, so a
      # new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        shell: bash
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: dart setup.dart windows --env ${{ inputs.env || 'pre' }} -v

      - name: Name the artifacts after our version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The packaging names files after the pubspec's three components; the
          # version users read adds today's count and the channel.
          stem="${VERSION%%-*}"
          base="${stem%.*}"
          shopt -s nullglob
          for file in dist/*; do
            name="$(basename "$file")"
            case "$name" in
              *"-${VERSION}-"*) ;;
              *"-${base}-"*)
                mv "$file" "dist/${name/-${base}-/-${VERSION}-}"
                ;;
              *)
                echo "::error::${name} carries neither ${base} nor ${VERSION}; the packaging names changed"
                exit 1
                ;;
            esac
          done
          # The packaging names the files after the upstream project; this fork
          # ships under its own name.
          for file in dist/*; do
            name="$(basename "$file")"
            case "$name" in
              FlClash-*) mv "$file" "dist/Skyward-${name#FlClash-}" ;;
            esac
          done
          ls -l dist

      # A packaging run that quietly produced only the zip, or only the
      # installer, still exits zero. Both are what a desktop preview is for.
      - name: Verify the preview
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(dist/*-windows-*.zip)
          setups=(dist/*-windows-*-setup.exe)
          if [ ${#zips[@]} -ne 1 ]; then
            echo "::error::expected one zip, found ${#zips[@]}"
            exit 1
          fi
          if [ ${#setups[@]} -ne 1 ]; then
            echo "::error::expected one installer, found ${#setups[@]}"
            exit 1
          fi
          for file in "${zips[0]}" "${setups[0]}"; do
            case "$(basename "$file")" in
              *"-${VERSION}-"*) ;;
              *)
                echo "::error::$(basename "$file") does not carry ${VERSION}"
                exit 1
                ;;
            esac
            if [ ! -s "$file" ]; then
              echo "::error::$(basename "$file") is empty"
              exit 1
            fi
          done
          # The zip carries the app under a directory of its own; a package
          # missing the executable is not something to hand over. Read it with
          # python: the bash on these runners is Git for Windows, which ships
          # no unzip -- `unzip -l` there fails rather than listing, and a
          # failing listing reads exactly like a missing executable.
          python - "${zips[0]}" <<'PY'
          import sys, zipfile

          archive = zipfile.ZipFile(sys.argv[1])
          names = archive.namelist()
          print(f"{sys.argv[1]} carries {len(names)} entries")
          for name in names[:40]:
              print(f"  {name}")
          leaf = {n.replace("\\", "/").rsplit("/", 1)[-1].lower() for n in names}
          if "skyward.exe" not in leaf:
              sys.exit(f"::error::{sys.argv[1]} carries no Skyward.exe")
          PY
          ls -l "${zips[0]}" "${setups[0]}"

      - name: Upload the preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-desktop-windows-${{ inputs.arch || 'amd64' }}
          path: ./dist
          if-no-files-found: error

      # A tag, not a Release: it is only the counter's diary. The next run
      # reads it back so two previews on the same day do not claim same number.
      - name: Tag the preview
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          tag="dev-win-${BASE_NUMBER}"
          sha="$(git rev-parse HEAD)"
          # The commit URL goes into the Telegram notice regardless of the tag.
          echo "commit=${sha}" >> "$GITHUB_OUTPUT"
          # The tag is only the counter's ledger, never a Release. GitHub
          # occasionally answers 403 here; a retry covers that. If it still
          # fails, warn instead of losing the build -- the next run may reuse
          # the number, which is preferable to shipping no package at all.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" -X DELETE 2>/dev/null || true
          tagged=""
          for _ in 1 2 3; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
                 -f "ref=refs/tags/${tag}" -f "sha=${sha}" > /dev/null 2>&1; then
              tagged=1
              break
            fi
            sleep 3
          done
          if [ -n "$tagged" ]; then
            echo "tagged ${tag} at ${sha}"
          else
            echo "::warning::could not create ${tag}; the next preview may reuse this number"
          fi

      # Publish the installers as a prerelease so the Telegram notice can carry
      # public gh-proxy download links for readers who cannot log in to GitHub.
      - name: Publish the preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_NUMBER: ${{ steps.version.outputs.build_number }}
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ inputs.ref || 'beta' }}
          ARCH: ${{ inputs.arch || 'amd64' }}
          PREVIOUS: ${{ steps.changelog.outputs.previous }}
          CHANGELOG: ${{ steps.changelog.outputs.entries }}
        run: |
          set -euo pipefail
          tag="dev-win-${BASE_NUMBER}"
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat > release-notes.md <<EOF
          Skyward ${VERSION} 桌面 Dev 版，只含 Windows ${ARCH}。
          EOF
          {
            echo
            echo "- 分支：\`${REF}\`"
            echo "- 版本：\`${VERSION}\`"
            echo "- 构建日志：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [ -n "$PREVIOUS" ] && [ -n "$CHANGELOG" ]; then
              echo
              echo "**自 \`${PREVIOUS}\` 以来**"
              printf '%s\n' "$CHANGELOG" | awk 'NR<=40'
            fi
          } >> release-notes.md
          # The tag was just created by "Tag the preview"; repoint it to HEAD
          # in case a retry left it elsewhere, then publish.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" \
            -f sha="$(git rev-parse HEAD)" -F force=true > /dev/null 2>&1 || true
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Skyward ${VERSION}（Windows Dev 版）" \
            --notes-file release-notes.md \
            --prerelease

  # The bot API needs a container to accept files over 50 MB, and GitHub only
  # runs services on Linux. The Windows build uploads its artifacts above; this
  # job downloads them and sends them as Telegram documents. No Release here.
  announce:
    name: Telegram
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 私聊 user ID 优先；未设置时回退到公开频道。
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest@sha256:e71b78c32ac7d6a56a127f8bb432aaa9cb0055fda37c3ef79d2b1b0723eadf70
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    steps:
      - name: Download the preview
        uses: actions/download-artifact@v4
        with:
          name: dev-desktop-windows-${{ inputs.arch || 'amd64' }}
          path: dist

      - name: Send to Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ needs.preview.outputs.version }}
          BASE_NUMBER: ${{ needs.preview.outputs.build_number }}
          REF: ${{ inputs.ref || 'beta' }}
          ARCH: ${{ inputs.arch || 'amd64' }}
          PREVIOUS: ${{ needs.preview.outputs.previous }}
          CHANGELOG: ${{ needs.preview.outputs.entries }}
          COMMIT: ${{ needs.preview.outputs.commit }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          chat_id="${TELEGRAM_PREVIEW_CHAT_ID:-$TELEGRAM_CHAT_ID}"

          # The self-hosted bot API accepts files over 50 MB, but it can be
          # slow to come up or fail to reach Telegram's DCs. Wait longer than
          # before, then fall back to the cloud API for the smaller file.
          local_api="http://localhost:8081/bot${TELEGRAM_BOT_TOKEN}"
          cloud_api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          api="$local_api"
          up=""
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 "${local_api}/getMe" > /dev/null 2>&1; then up=1; break; fi
            sleep 3
          done
          if [ -z "$up" ]; then
            echo "::warning::telegram-bot-api never answered on localhost:8081, falling back to the cloud API (files over 50 MB will be skipped)"
            api="$cloud_api"
          fi

          {
            echo "🧪 Skyward ${VERSION}（Windows 桌面 Dev 版）"
            echo
            echo "分支 \`${REF}\` ｜ Windows ${ARCH}"
            echo "构建号 ${BASE_NUMBER}"
            if [ -n "$PREVIOUS" ] && [ -n "$CHANGELOG" ]; then
              echo
              echo "📝 自 \`${PREVIOUS}\` 以来："
              printf '%s\n' "$CHANGELOG" | awk 'NR<=8'
            fi
            echo
            echo "🔗 构建日志 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "🔗 提交 https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT}"
            base="https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-win-${BASE_NUMBER}"
            for f in dist/*.exe dist/*.zip; do
              [ -f "$f" ] && echo "📦 $(basename "$f") → ${base}/$(basename "$f")"
            done
          } > "$RUNNER_TEMP/body.txt"
          cat "$RUNNER_TEMP/body.txt"

          sent=0
          first=1
          for file in dist/*.exe dist/*.zip; do
            [ -f "$file" ] || continue
            size=$(stat -c %s "$file")
            # The cloud Bot API refuses files over 50 MB.
            if [ "$api" = "$cloud_api" ] && [ "$size" -gt 52428800 ]; then
              echo "::warning::$(basename "$file") is over 50 MB; the local bot API is down so it cannot be attached"
              continue
            fi
            if [ "$first" = 1 ]; then
              cp "$RUNNER_TEMP/body.txt" "$RUNNER_TEMP/caption.txt"
              printf '\n⬇️ 点击下方直链下载安装包\n' >> "$RUNNER_TEMP/caption.txt"
              response="$(curl -fsS --max-time 900 \
                -F "chat_id=${chat_id}" \
                -F "document=@${file}" \
                -F "caption=$(cat "$RUNNER_TEMP/caption.txt")" \
                "${api}/sendDocument")" || response=""
              first=0
            else
              response="$(curl -fsS --max-time 900 \
                -F "chat_id=${chat_id}" \
                -F "document=@${file}" \
                "${api}/sendDocument")" || response=""
            fi
            if printf '%s' "$response" | grep -q '"ok":true'; then
              echo "telegram accepted $(basename "$file")"
              sent=1
            else
              echo "::warning::Telegram refused $(basename "$file"): ${response}"
            fi
          done

          # Last resort: no file got through (e.g. the cloud API rate-limited
          # and the local one is down). Send the text with links so the reader
          # can still reach the build, and fail the job so it is visible.
          if [ "$sent" = 0 ]; then
            {
              echo "🧪 Skyward ${VERSION}（Windows 桌面 Dev 版）"
              echo
              echo "分支 \`${REF}\` ｜ Windows ${ARCH} ｜ 构建号 ${BASE_NUMBER}"
              if [ -n "$PREVIOUS" ] && [ -n "$CHANGELOG" ]; then
                echo
                echo "📝 自 \`${PREVIOUS}\` 以来："
                printf '%s\n' "$CHANGELOG" | awk 'NR<=8'
              fi
              echo
              echo "🔗 构建日志 ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "🔗 提交 https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT}"
              base="https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/dev-win-${BASE_NUMBER}"
              for f in dist/*.exe dist/*.zip; do
                [ -f "$f" ] && echo "📦 $(basename "$f") → ${base}/$(basename "$f")"
              done
            } > "$RUNNER_TEMP/text.txt"
            curl -fsS --max-time 60 -X POST "${cloud_api}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text@$RUNNER_TEMP/text.txt" \
              || echo "::warning::Telegram 文本兜底也失败"
          fi
