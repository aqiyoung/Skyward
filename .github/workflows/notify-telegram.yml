name: notify-telegram

# 把「已发布」的 Rust 安卓 APK 推送到 Dev 预览 Telegram（个人 chat），沿用旧
# dev-preview.yaml 的 secrets 与 chat 回落规则：
#   TELEGRAM_PREVIEW_CHAT_ID（Dev 预览 / 个人）优先，未设置则回落 TELEGRAM_CHAT_ID。
#
# 推送的唯一路径是 workflow_dispatch（手动派发）。TG 消息不可撤回，因此：
#   * 不挂 schedule，不挂 PR；
#   * 下面那个 push 触发器仅用于「让 GitHub 注册这个工作流」——非默认分支上
#     只挂 workflow_dispatch 的工作流不会被登记，dispatch API 会返回 404。
#     它的 paths 只包含本文件自身，且 job 有硬拦截 if，push 产生的 run 一定
#     被跳过，绝不会发送任何消息。
# 不构建、不打 tag、不改默认分支、不进公共频道。APK 仅 0.35 MB，直接走官方
# api.telegram.org/sendDocument（无需旧版那个绕 50 MB 上限的本地 Bot API server）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已发布的 Release tag'
        required: true
        default: 'rust-0.1.0.N-dev'
      asset:
        description: 'Release 里的 APK 文件名'
        required: true
        default: 'Skyward-Rust-PoC-0.1.0.N-dev-arm64-v8a.apk'
  push:
    branches: [ rust-android ]
    paths:
      - '.github/workflows/notify-telegram.yml'

permissions:
  contents: read

jobs:
  send:
    # 硬拦截：只有手动派发才真正发送。push 那次 run 只为完成工作流注册。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag }}
      ASSET: ${{ inputs.asset }}
      REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
    steps:
      - name: Download published APK
        run: |
          set -euo pipefail
          url="https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
          echo "fetching ${url}"
          curl -fsSL --max-time 300 -o app.apk "$url"
          ls -l app.apk
          unzip -l app.apk | grep -E "AndroidManifest.xml|classes.dex|libskyward_core.so"
          test -s app.apk

      - name: Send document to Dev preview chat
        run: |
          set -euo pipefail
          # 双保险：即便 job 级 if 被误改，非 dispatch 事件也绝不发送。
          if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "skip: event=${EVENT_NAME} is not workflow_dispatch"
            exit 0
          fi
          chat_id="${TELEGRAM_PREVIEW_CHAT_ID:-${TELEGRAM_CHAT_ID:-}}"
          if [ -z "$chat_id" ] || [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::Telegram secrets not configured"
            exit 1
          fi
          size=$(stat -c%s app.apk)
          mb=$(awk "BEGIN{printf \"%.2f\", ${size}/1048576}")
          cat > /tmp/caption.txt << CAP
          Skyward Rust 安卓 · ${TAG}（UI 骨架版）
          仅 arm64-v8a · ${mb} MB（现行 Flutter 版 60.30 MB）
          12 个 JNI 符号 · debug 签名 · 装机需允许未知来源
          包名 com.threely.skyward.poc，与现行 Flutter 版可并存不覆盖

          本版补齐界面骨架：底部 4 Tab（首页/代理/配置/我的）+ 分组卡片，
          状态卡、流量、节点列表、订阅、设置中心都有内容；液态玻璃默认关闭。
          基准改为按需点击、分段刷新，不再启动时卡在 running。
          内核读数走 Rust JNI 实时值；节点/流量/配置为演示数据。

          注意：仍是 PoC，不含协议栈 / geo / 真实 tun 转发，不能连代理；
          VpnService 仅声明、不触发，装机不会误断网。

          Release: https://github.com/${REPO}/releases/tag/${TAG}
          来源：rust-android 独立分支（非默认分支）· 手动派发
          CAP
          http=$(curl -sS --max-time 180 -o /tmp/tg_resp.json -w "%{http_code}" \
            -F "chat_id=${chat_id}" \
            -F "document=@app.apk;filename=${ASSET}" \
            -F "caption=$(cat /tmp/caption.txt)" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")
          resp=$(cat /tmp/tg_resp.json)
          if [ "$http" != "200" ] || ! grep -q '"ok":true' <<< "$resp"; then
            echo "::error::Telegram HTTP ${http}: ${resp}"
            exit 1
          fi
          echo "Telegram sendDocument ok (HTTP ${http})"
