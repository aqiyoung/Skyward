name: dev-preview

# The independent dev channel: one platform, no tests, the fast loop for putting
# a `dev`-branch change on a phone. Every push to `dev` rebuilds it. This is a
# standalone workflow -- it does NOT go through `beta` or the `preview` channel,
# so dev work stays isolated from the release/preview pipeline.
#
# A dev build is a prerelease under a `dev-` tag. It shares the version counter
# with the releases (and reads the preview tags too, so numbers never collide)
# rather than sitting above them -- Android installs one over the other only
# when the versionCode rises -- so every run claims its number with a tag, and
# the next reader sees that number as taken.

on:
  push:
    branches:
      - dev
    # A preview exists to put app code on a phone; a docs or automation commit
    # has nothing to install.
    paths-ignore:
      - '.github/**'
      - '**/*.md'
      # The desktop preview's trigger. A build of that one changes no app code,
      # and rebuilding the phone preview beside it would only add a tag.
      - '.desktop-preview'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        type: string
        default: dev
      env:
        description: Value passed to `dart setup.dart --env`
        type: choice
        options:
          - pre
          - dev
          - stable
        default: pre
      package:
        description: 'applicationId: ours = com.threely.skyward, upstream = com.follow.clash (diagnostic only)'
        type: choice
        options:
          - ours
          - upstream
        default: ours
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to build
        type: string
        default: dev
      package:
        description: 'ours = com.threely.skyward, upstream = com.follow.clash (diagnostic only)'
        type: string
        default: ours

# A preview is expendable: a newer one supersedes the one still building.
concurrency:
  group: dev-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  # Reading back the last preview run that actually finished, so a cancelled
  # run's orphan tag cannot become the changelog baseline.
  actions: read

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  preview:
    name: Android arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The APK is ~60 MB, past the cloud Bot API's 50 MB upload cap, so the
    # upload goes through this server instead of api.telegram.org. It exists
    # only for the length of the job.
    services:
      telegram-bot-api:
        image: aiogram/telegram-bot-api:latest
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        ports:
          - 8081:8081
    # Job level, not step level: a step's `if` cannot see its own `env`.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Preview builds target this chat when set, keeping phone-only builds out
      # of the public release channel. When unset the step falls back to
      # TELEGRAM_CHAT_ID, so the current behaviour is preserved until a value
      # is added.
      TELEGRAM_PREVIEW_CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          submodules: recursive

      # Diagnostic only: the Tencent engine's verdict may follow the package
      # id, so this rebuilds the same tree under upstream's id for a scan to
      # compare. It is never a release.
      - name: Choose the package id
        if: inputs.package == 'upstream'
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "com.threely.skyward"/applicationId = "com.follow.clash"/' android/app/build.gradle.kts
          grep -n 'applicationId' android/app/build.gradle.kts

      # A dev build draws its versionCode from the same counter ci.yaml uses --
      # 2,090,000,000 plus a hundred per day since 2026-01-01 plus the sequence
      # that day, read back from the releases already out -- so it installs over
      # the release on the phone and the next release installs over it.
      # Numbering snapshots above the releases ended with a release refused as a
      # downgrade, which is why the counter is shared rather than offset.
      #
      # The version a user reads is the four components plus `-dev`:
      # `1.0.1.07-dev`. The fourth component is today's count, not a release
      # number -- a snapshot spends none -- and the suffix says who built it.
      # The versionCode above stays out of it, where it orders installs without
      # being read as a version.
      - name: Choose a dev version
        id: version
        env:
          # The shared counter is read back from the releases, which the API
          # only answers when authenticated.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -1 | tr -d '\r')"
          if ! printf '%s' "$base" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::expected a three-component version in pubspec.yaml, got '$base'"
            exit 1
          fi
          now=$(date -u +%s)
          origin=$(date -u -d 2026-01-01 +%s)
          day_prefix=$(( 20900000 + (now - origin) / 86400 ))
          titles=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '[.[] | .name, .body] | .[]' 2>/dev/null || true)
          # A preview publish creates no release, so the number it claimed
          # survives only in the tag the next step writes. Read those back too,
          # or this run counts to the same number the last one already took.
          # dev shares the day-prefix counter with the release and the preview
          # channel, so it reads both `preview-` and `dev-` tags back -- a number
          # either channel took that day is off the table, and a dev build never
          # collides on versionCode with a preview or release from the same day.
          claimed=$({ gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/preview-${day_prefix}" \
            --jq '.[].ref' 2>/dev/null; gh api \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/dev-${day_prefix}" \
            --jq '.[].ref' 2>/dev/null; } | sort -u || true)
          highest_stamp=$(printf '%s\n%s\n' "$titles" "$claimed" \
            | sed -n "s/.*${day_prefix}\([0-9][0-9]*\).*/\1/p" | sort -n | tail -1)
          stamp=$(( 10#${highest_stamp:-0} + 1 ))
          build_number=$(( day_prefix * 100 + stamp ))
          version="${base}.$(printf '%02d' "$stamp")-dev"
          awk -v v="${base}+${build_number}" '/^version:/{ print "version: " v; next } { print }' \
            pubspec.yaml > pubspec.yaml.new
          mv pubspec.yaml.new pubspec.yaml
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "building ${version} from ${base}, versionCode ${build_number}"

      # The counter above is only what previous runs wrote down, so this run has
      # to write its number down too: a lightweight tag under it. Without that
      # the next reader sees the counter as unchanged and hands out the same
      # number -- a preview and the release that follows it then share a
      # versionCode, and the app decides what to offer by comparing exactly
      # those numbers, so a phone running the preview is never told about that
      # release. (A preview publish creates no release of its own, which is why
      # the tag is the only place the number survives.)
      #
      # Claimed before anything is built rather than after: a number that never
      # produced an artifact only costs a number, a number two runs share costs
      # a release nobody hears about. Re-running the same commit finds its own
      # tag and carries on; a different commit holding the tag means another run
      # already took the number.
      - name: Claim the build number
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          claimed="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '.object.sha' 2>/dev/null || true)"
          # An unknown ref answers 404 with a JSON body on stdout rather than an
          # empty string, so anything that is not a commit sha means the number
          # is still free.
          if ! printf '%s' "$claimed" | grep -Eq '^[0-9a-f]{40}$'; then
            claimed=""
          fi
          if [ -n "$claimed" ] && [ "$claimed" != "$sha" ]; then
            echo "::error::${TAG} is already claimed by ${claimed}; another run took this number"
            exit 1
          fi
          if [ -z "$claimed" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" -f sha="$sha" > /dev/null
          fi
          echo "counter: ${TAG} claimed on ${sha}"

      # What changed since the previous preview, so the phone shows the point of
      # the build rather than a bare version number.
      #
      # The caption is read by Chinese-speaking users while commit subjects are
      # English, so the prose comes from the `Changelog-Zh:` trailer each
      # user-visible commit carries. CHANGELOG.zh.md's `未发布` section is only
      # the fallback for a range written before that rule existed.
      - name: Collect the changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          # The checkout is one commit deep, so the range below would otherwise
          # hold just this merge commit — and every commit worth describing is
          # behind it. Deepen before walking history.
          git fetch --unshallow --tags --quiet 2>/dev/null \
            || git fetch --tags --quiet \
            || true
          commit="$(git rev-parse HEAD)"
          # Preview releases are deleted (Telegram-only policy), so tags were
          # the only record of a build. But a tag is claimed before anything is
          # built: when a newer push cancels that run, its tag survives with no
          # artefact behind it. The next caption then compares against a commit
          # that never shipped -- either an empty range (falling back to stale
          # CHANGELOG.zh.md prose) or one that skips the cancelled run's work.
          #
          # Anchor the range on the head of the last preview run that actually
          # finished successfully instead. The runs API is read-only here; if
          # it is unavailable, keep the old tag lookup as a fallback.
          jq_filter='[.workflow_runs[] | select(.conclusion == "success" and .head_sha != "'"$commit"'")] | .[0].head_sha // ""'
          previous_sha=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/dev-preview.yaml/runs?status=completed&per_page=30" \
            --jq "$jq_filter" 2>/dev/null || true)
          if [ -n "$previous_sha" ] \
            && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
            previous="$previous_sha"
            echo "changelog baseline: last successful preview run on ${previous_sha:0:12}"
          else
            previous=$(git tag --list "dev-*" --sort=-creatordate \
              | grep -vx "$TAG" | head -1 || true)
            echo "changelog baseline: newest tag (runs API unavailable)"
          fi

          entries=""
          if [ -n "$previous" ]; then
            echo "changelog: $previous...$commit"
            # The rule: every user-visible commit carries a `Changelog-Zh:`
            # trailer, and the caption is built from those. One line each, so
            # the caption never needs a second hand-written file to stay in
            # sync. Falls back to CHANGELOG.zh.md when the range has none.
            #
            # Fields are tab-separated: bash drops NUL bytes in command
            # substitution, which silently emptied a `%x00` split. Merges are
            # kept because the merge commit is often the only one carrying the
            # trailer; duplicates are folded after, not filtered before.
            entries=$(git log --reverse \
              --format='%h%x09%(trailers:key=Changelog-Zh,valueonly)' \
              "$previous..$commit" 2>/dev/null \
              | awk -F'\t' 'NF > 1 && $2 != "" { print "- " $2 }' \
              | awk '!seen[$0]++' \
              | tac | awk 'NR<=8' || true)
          fi

          if [ -n "$entries" ]; then
            echo "changelog source: Changelog-Zh trailers"
          elif [ -f CHANGELOG.zh.md ]; then
            # Fallback for older commits written before the trailer rule: only
            # the `## 未发布` section, since a versioned section below it is
            # history the phone has already been told about.
            entries=$(awk '
              /^## 未发布[[:space:]]*$/ { capture = 1; next }
              /^## / { capture = 0 }
              capture && NF { print }
            ' CHANGELOG.zh.md)
            if [ -n "$entries" ]; then
              echo "changelog source: CHANGELOG.zh.md (未发布)"
            fi
          fi

          if [ -z "$entries" ] && [ -n "$previous" ]; then
            echo "::notice::no Changelog-Zh trailer and no 未发布 section; falling back to commit subjects"
            entries=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${previous}...${commit}" \
              --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null \
              | sed '/^$/d; s/^/- /' | grep -v '^- ci' | tac | awk 'NR<=40' || true)
          elif [ -z "$previous" ]; then
            echo "::notice::this is the first preview; no changelog range"
          fi

          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          {
            echo "entries<<CHANGELOG_END"
            printf '%s\n' "$entries"
            echo "CHANGELOG_END"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Android release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PW: ${{ secrets.KEYSTORE_PASS }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          pw="${STORE_PW:-${KEY_PW:-${KEYSTORE_PW:-}}}"
          alias="${ALIAS:-flclash}"

          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::KEYSTORE secret is missing; refusing to publish a debug-signed APK"
            exit 1
          fi
          if [ -z "$pw" ]; then
            echo "::error::STORE_PASSWORD secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 -d > /tmp/keystore.p12
          keytool -importkeystore \
            -srckeystore /tmp/keystore.p12 -srcstoretype PKCS12 -srcstorepass "$pw" \
            -destkeystore android/app/keystore.jks -deststoretype JKS \
            -deststorepass "$pw" -destkeypass "$pw" -noprompt

          {
            echo "storePassword=$pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$pw"
          } >> android/local.properties

          # `assembleRelease` is finalizedBy the Crashlytics native symbol
          # upload, which belongs to upstream's Firebase project. Drop the
          # finalizer so the release build cannot fail on it.
          python3 - <<'PY'
          p = "android/app/build.gradle.kts"
          s = open(p, encoding="utf-8").read()
          marker = 'finalizedBy("uploadCrashlyticsSymbolFileRelease")'
          if marker not in s:
              print("Crashlytics finalizer absent, nothing to remove")
          else:
              idx = s.index(marker)
              open_idx = s.rfind('if (hasReleaseSigning) {', 0, idx)
              i = s.index('{', open_idx)
              depth = 0
              while i < len(s):
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
                  i += 1
              open(p, "w", encoding="utf-8").write(s[:open_idx] + s[end + 1:])
              print("Removed the Crashlytics finalizer block")
          PY

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: preview-android-arm64
          workspaces: services/helper
          cache-directories: .dart_tool/hooks_runner

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      # Same bundle as the release build: the Core embeds it and
      # FlClashHttpOverrides.trustCoreRoots hands it to Dart, and the submodule
      # only carries a 0-byte placeholder.
      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          # The versionCode, kept out of the version on purpose: Android orders
          # installs by it, the user reads the version above.
          APP_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          APP_CHANNEL_NAME: dev
        run: dart setup.dart android --env ${{ inputs.env || 'pre' }} --arch arm64 -v

      - name: Name the artifact after our version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The packaging names files after the pubspec's three components; the
          # version users read adds today's count and the channel.
          stem="${VERSION%%-*}"
          base="${stem%.*}"
          shopt -s nullglob
          for file in dist/*; do
            name="$(basename "$file")"
            case "$name" in
              *"-${VERSION}-"*) ;;
              *"-${base}-"*)
                mv "$file" "dist/${name/-${base}-/-${VERSION}-}"
                ;;
              *)
                echo "::error::${name} carries neither ${base} nor ${VERSION}"
                exit 1
                ;;
            esac
          done
          # The packaging names the files after the upstream project; this fork
          # ships under its own name.
          for file in dist/*; do
            name="$(basename "$file")"
            case "$name" in
              FlClash-*) mv "$file" "dist/Skyward-${name#FlClash-}" ;;
            esac
          done
          # `--arch arm64` also means "do not split", so the one APK loses the
          # `-arm64-v8a` the split used to put in its name. Both the in-app
          # updater (it picks the asset holding the device's ABI) and the
          # Telegram upload match on that part, so put it back.
          apks=(dist/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected one APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          mv "${apks[0]}" "dist/Skyward-${VERSION}-android-arm64-v8a.apk"
          ls -l dist

      # `--arch arm64` has to actually limit the APK, not merely prefer arm64: a
      # package carrying the x86 libraries is not the thing being tested.
      - name: Verify the preview
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLICATION_ID: ${{ inputs.package == 'upstream' && 'com.follow.clash' || 'com.threely.skyward' }}
          CERT_SHA256: 65379ed725abfd2330bc2134aaa276ba59a50d5e606f443818003f362c593570
        run: |
          set -euo pipefail
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          apks=(dist/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::expected one APK, found ${#apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          echo "== $(basename "$apk")"
          # `pipefail` plus `grep -q` is a trap: grep leaves on its first match,
          # the writer behind it takes EPIPE, and the pipeline reports the
          # writer's death as the failure. Each output is read once, then matched.
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          certs="$("$build_tools/apksigner" verify --print-certs "$apk" | tr -d ':')"
          listing="$(unzip -l "$apk")"
          sed -n '1p' <<<"$badging"
          sed -n '1,4p' <<<"$certs"

          version_code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$badging" | head -1)"
          if [ -z "$version_code" ]; then
            echo "::error::could not read the APK's versionCode"
            exit 1
          fi
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "the APK carries versionCode ${version_code}"

          if ! grep -q "package: name='${APPLICATION_ID}'" <<<"$badging"; then
            echo "::error::$(basename "$apk") is not packaged as ${APPLICATION_ID}"
            exit 1
          fi
          if ! grep -qi "$CERT_SHA256" <<<"$certs"; then
            echo "::error::$(basename "$apk") is not signed with our certificate (expected SHA-256 $CERT_SHA256)"
            exit 1
          fi
          if ! grep -q "versionName='${VERSION}'" <<<"$badging"; then
            echo "::error::$(basename "$apk") does not carry ${VERSION} as its versionName"
            exit 1
          fi
          if grep -qE 'lib/(armeabi-v7a|x86|x86_64)/' <<<"$listing"; then
            echo "::error::$(basename "$apk") still carries a non-arm64 ABI"
            exit 1
          fi
          grep -q 'lib/arm64-v8a/' <<<"$listing" || {
            echo "::error::$(basename "$apk") has no arm64-v8a libraries"
            exit 1
          }

      - name: Upload the preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-android-arm64
          path: ./dist
          if-no-files-found: error
      
      - name: Prune old previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,createdAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("dev-")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "deleting $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done

          # A preview publishes no release, so its tag is all that is left to
          # prune, and the tags are also the counter's only ledger. The counter
          # reads one day's numbers, so the most recent handful always covers it
          # -- the highest number of the day is the last one claimed, never the
          # one that falls off the end.
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/dev-??per_page=100" \
            --paginate --jq '.[].ref' 2>/dev/null \
            | sed -n 's#^refs/tags/preview-##p' \
            | sort -rn | awk 'NR > 10' \
          | while read -r number; do
              [ -z "$number" ] && continue
              echo "deleting tag dev-${number}"
              gh api -X DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/dev-${number}" || true
            done

      # The APK is far over the cloud Bot API's 50 MB upload cap, so the message
      # carries links to the release rather than the file itself.
      # The file itself, not a link: the self-hosted server above takes 2 GB,
      # while the cloud Bot API would answer 413 for this APK.
      - name: Upload the preview to Telegram
        # Send whenever a token is present and at least one target chat is
        # configured. The preview-specific chat takes priority; the public one
        # is the fallback, so the step still runs if only that is set.
        if: env.TELEGRAM_BOT_TOKEN != '' && (env.TELEGRAM_PREVIEW_CHAT_ID != '' || env.TELEGRAM_CHAT_ID != '')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BASE_NUMBER: ${{ steps.version.outputs.build_number }}
          VERSION_CODE: ${{ steps.verify.outputs.version_code }}
          REF: ${{ inputs.ref || github.ref_name }}
          APPLICATION_ID: ${{ inputs.package == 'upstream' && 'com.follow.clash' || 'com.threely.skyward' }}
          CHANGELOG: ${{ steps.changelog.outputs.entries }}
        run: |
          set -euo pipefail
          api="http://localhost:8081/bot${TELEGRAM_BOT_TOKEN}"

          # A container without TELEGRAM_API_ID/TELEGRAM_API_HASH exits at
          # once, and the only symptom would be a refused connection here.
          up=""
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "${api}/getMe" > /tmp/getme.json 2>/dev/null; then
              up=1
              break
            fi
            sleep 2
          done
          if [ -z "$up" ] || ! grep -q '"ok":true' /tmp/getme.json; then
            echo "::error::telegram-bot-api never answered on localhost:8081 — check TELEGRAM_API_ID/TELEGRAM_API_HASH (container log above) and TELEGRAM_BOT_TOKEN"
            exit 1
          fi

          # A caption is capped at 1024 characters. The entries are already
          # short and in Chinese, so they are shown whole -- cutting by byte
          # (`cut -c`) would split a multi-byte character in half.
          {
            echo "🧪 Skyward ${VERSION}"
            echo
            echo "分支 ${REF} ｜ 包名 ${APPLICATION_ID}"
            echo "Android arm64-v8a 单架构"
            if [ -n "${CHANGELOG}" ]; then
              echo
              echo "📝 本次更新"
              printf '%s\n' "${CHANGELOG}" | awk 'NF' | head -8
            fi
            echo
            echo "⬇️ 安装包即本条消息附件"
            echo "（Dev 版，不是正式发布：签名与正式版相同，可直接覆盖安装）"
          } > /tmp/caption.txt
          cat /tmp/caption.txt

          shopt -s nullglob
          for apk in dist/*.apk; do
            echo "uploading $(basename "${apk}") ($(du -h "${apk}" | cut -f1))..."
            # Prefer the preview-only chat; fall back to the public one when it
            # is not configured.
            chat_id="${TELEGRAM_PREVIEW_CHAT_ID:-$TELEGRAM_CHAT_ID}"
            response="$(curl -fsS --max-time 900 \
              -F "chat_id=${chat_id}" \
              -F "document=@${apk}" \
              -F "caption=$(cat /tmp/caption.txt)" \
              "${api}/sendDocument")"
            if ! printf '%s' "$response" | grep -q '"ok":true'; then
              echo "::error::Telegram refused $(basename "${apk}"): ${response}"
              exit 1
            fi
            echo "telegram accepted $(basename "${apk}")"
          done


