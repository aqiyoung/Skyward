name: format-fix

# One-off helper: run `dart format` with the same Flutter pin as checks and
# push the result. Used once to clear the Check format failures; delete after.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to format and push'
        required: true
        type: string

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.6'

      # Mirrors checks: pub get first so package_config pins the language
      # version dart format parses with.
      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test tool plugins setup.dart

      - name: Commit and push
        run: |
          git add lib test tool plugins setup.dart
          if git diff --cached --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: dart format 全仓（与 checks 同一 Flutter 版本）' \
            -m 'Changelog: skip'
          git push origin HEAD:refs/heads/${{ inputs.branch }}
