name: diag tests

# Temporary: the job log for a failed run is too large to read from here, so
# this runs the one suspect test twice -- on the rename commit and on the beta
# head before it -- and prints both results. Deleted once understood.

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  TEST_FILE: test/widgets/uncovered_views_test.dart
  TEST_NAME: about view shows progress while checking for updates

jobs:
  diag:
    name: Diag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: beta
          submodules: recursive
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Rename commit, one test
        run: |
          set +e
          flutter test "$TEST_FILE" --plain-name "$TEST_NAME" --reporter expanded > /tmp/new.txt 2>&1
          echo "exit=$?"
          tail -60 /tmp/new.txt

      - name: Beta before the rename, one test
        run: |
          set +e
          git worktree add /tmp/old ead7f4ed72b707f14778eb8b352a643a0084e04c
          cd /tmp/old
          flutter pub get > /dev/null 2>&1
          flutter test "$TEST_FILE" --plain-name "$TEST_NAME" --reporter expanded > /tmp/old.txt 2>&1
          echo "exit=$?"
          tail -60 /tmp/old.txt
