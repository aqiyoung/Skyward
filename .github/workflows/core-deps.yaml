name: core deps

# The Go core is two modules: the kernel (core/Clash.Meta) and the wrapper
# that binds it (core/). When the kernel takes on a new dependency, the
# wrapper's module graph moves with it, and go.mod and go.sum have to be
# written again.
#
# This job is what writes them. It resolves the modules and commits the
# result to the branch; it does not build anything, because the kernel check
# is what builds, and it has to stay green before the result is merged.
#
# go mod tidy resolves modules and does not build the app, which is why it
# runs here rather than on a machine.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to write the result to'
        required: true
        default: dev

permissions:
  contents: write

env:
  GO_VERSION: '1.27.1'

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      # The submodule URL is SSH; public repos clone fine over HTTPS, so redirect.
      - name: Clone submodules over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Resolve the modules
        working-directory: core
        run: |
          set -euo pipefail
          go mod tidy
          go build ./...
          go vet . ./cmd/...
      - name: Write the result back
        run: |
          set -euo pipefail
          if git diff --quiet -- core/go.mod core/go.sum; then
            echo 'Nothing changed; the module graph was already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/go.mod core/go.sum
          git commit -m "build: carry the core's dependency moves"
          git push origin HEAD:${{ inputs.branch }}
          echo "Pushed $(git rev-parse HEAD)"
