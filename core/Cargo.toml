[package]
name = "skyward-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "skyward_core"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "bench"
path = "examples/bench.rs"

[dependencies]
# 数据面地基（PoC-5）：异步运行时 + 真实 socket 基础。
# 仅启用内核所需最小特性集，避免无谓膨胀；后续协议 / tun 均复用此运行时。
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# 出站协议（PoC-6）：Shadowsocks AEAD。纯 Rust 实现，无 C 依赖、无硬件加速分支，
# 在 aarch64-linux-android 可干净交叉编译。
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
