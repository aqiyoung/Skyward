<svg width="480" height="480" viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <!-- The site mark: the S of Skyward (same geometry as assets_source/images/icon/glyph.svg)
       on a warm tile, in the site's orange-red hue. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="oklch(0.29 0.05 32)"/>
      <stop offset="1" stop-color="oklch(0.15 0.025 32)"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0.15" y1="0.95" x2="0.85" y2="0.05">
      <stop offset="0%" stop-color="oklch(0.62 0.19 32)"/>
      <stop offset="100%" stop-color="oklch(0.85 0.12 58)"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" rx="108" fill="url(#tile)"/>
  <path d="M330,150 C316,106 244,96 198,126 C150,156 168,214 232,238 C296,262 330,302 300,344 C270,386 194,384 158,340"
        fill="none" stroke="url(#ribbon)" stroke-width="78" stroke-linecap="round"/>
