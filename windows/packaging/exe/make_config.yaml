script_template: inno_setup.iss
# Skyward's own identity. FlClash's GUID made Inno keep the previous install
# directory and Start menu group, so an upgrade still landed in FlClash.
app_id: 2DA60D9A-1F82-4E9D-AE25-D9FF599B50B2
app_name: Skyward
publisher: aqiyoung
publisher_url: https://github.com/aqiyoung/Skyward
display_name: Skyward
executable_name: Skyward.exe
output_base_file_name: Skyward.exe
# Resolved against the project root: flutter_distributor turns this into an
# absolute path via Directory.current.
setup_icon_file: windows\runner\resources\app_icon.ico
locales:
  # Written into the .iss verbatim, so this one stays relative to the generated
  # script in dist/.
  - lang: zh
    file: ..\windows\packaging\exe\ChineseSimplified.isl
  - lang: en
privileges_required: admin